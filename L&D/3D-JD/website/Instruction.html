              if(e.button!==0&&e.button!==1)return;
              isDown=true;
              hasMoved=false;
              scroll.classList.add('panning');
              startX=e.clientX;
              startY=e.clientY;
              scrollLeft=scroll.scrollLeft;
              scrollTop=scroll.scrollTop;
            });
            window.addEventListener('mousemove',function(e){
              if(!isDown)return;
              var dx=e.clientX-startX;
              var dy=e.clientY-startY;
              if(Math.abs(dx)>3||Math.abs(dy)>3)hasMoved=true;
              scroll.scrollLeft=scrollLeft-dx;
              scroll.scrollTop=scrollTop-dy;
            });
            window.addEventListener('mouseup',function(){
              if(isDown){isDown=false;scroll.classList.remove('panning');}
            });
            scroll.addEventListener('dragstart',function(e){e.preventDefault()});
            scroll.addEventListener('click',function(e){
              if(hasMoved){e.preventDefault();e.stopPropagation();hasMoved=false;}
            },true);
            scroll.addEventListener('wheel',function(event){
              if(!event.ctrlKey&&!event.metaKey)return;
              event.preventDefault();
              zoom(scroll,event.deltaY<0?.1:-.1);
            },{passive:false});
          });
          window.addEventListener('keydown',function(e){
            var activeScroll=document.querySelector('.lumenboard-diagram-scroll');
            if(!activeScroll)return;
            var step=80;
            if(e.key==='ArrowLeft'){activeScroll.scrollLeft-=step;}
            else if(e.key==='ArrowRight'){activeScroll.scrollLeft+=step;}
            else if(e.key==='ArrowUp'){activeScroll.scrollTop-=step;}
            else if(e.key==='ArrowDown'){activeScroll.scrollTop+=step;}
            else if(e.key==='Escape'){
              if(document.body.classList.contains('lumenboard-focus-mode'))exit(true);
            }
          });
          ['fullscreenchange','webkitfullscreenchange','mozfullscreenchange','MSFullscreenChange'].forEach(function(ev){
            document.addEventListener(ev,function(){
              var cur=getFsElement();
              if(cur){
                wasNativeFullscreen=true;
              }else if(wasNativeFullscreen){
                wasNativeFullscreen=false;
                if(document.body.classList.contains('lumenboard-focus-mode'))exit(false);
              }
            });
          });
          var t=s&&s.querySelector('.toggle');
          if(t){
            t.textContent='';
            t.setAttribute('aria-label','Open navigation');
            t.setAttribute('title','Open navigation');
            t.addEventListener('click',function(){window.setTimeout(sync,0)});
          }
          sync();
          document.addEventListener('click',function(e){
            var a=e.target.closest('a');
            if(!a)return;
            var href=a.getAttribute('href');
            if(!href)return;
            if(a.hasAttribute('data-download-bypass')||href.indexOf('blob:')===0)return;
            var clean=href.split('?')[0].split('#')[0];
            if(/.json$/i.test(clean)||a.hasAttribute('data-download-json')){
              e.preventDefault();
              e.stopPropagation();
              var fn=a.getAttribute('download')||decodeURIComponent(clean.split('/').pop()||'data.json');
              fetch(href).then(function(r){
                if(!r.ok)throw new Error('status '+r.status);
                return r.blob();
              }).then(function(b){
                var u=URL.createObjectURL(b);
                var dl=document.createElement('a');
                dl.setAttribute('data-download-bypass','true');
                dl.href=u;
                dl.download=fn;
                document.body.appendChild(dl);
                dl.click();
                document.body.removeChild(dl);
                setTimeout(function(){URL.revokeObjectURL(u);},1500);
              }).catch(function(){
                var dl=document.createElement('a');
                dl.setAttribute('data-download-bypass','true');
                dl.href=href;
                dl.download=fn;
                dl.target='_blank';
                document.body.appendChild(dl);
                dl.click();
                document.body.removeChild(dl);
              });
            }
          },true);
          var focusNeeded=false;
          try{
            focusNeeded=new URLSearchParams(window.location.search).get('focus')==='1'||sessionStorage.getItem('lumenboard_focus')==='1';
          }catch(e){
            focusNeeded=new URLSearchParams(window.location.search).get('focus')==='1';
          }
          if(focusNeeded)enter(false);
        })();</script><script src="assets/js/lumenboard-export.js"></script></body></html>
