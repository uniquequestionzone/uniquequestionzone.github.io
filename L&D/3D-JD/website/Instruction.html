                if(token!==currentToken)return;
                if(sentenceIndex>=sentences.length){
                  stop();
                  return;
                }

                var textChunk=sentences[sentenceIndex++];
                var utterance=new SpeechUtterance(textChunk);
                utterance.rate=0.91;
                utterance.pitch=1.02;
                utterance.volume=1;
                if(voiceToUse){
                  utterance.voice=voiceToUse;
                }

                window._lumenboardUtterances.push(utterance);

                utterance.onstart=function(){
                  if(token!==currentToken)return;
                  setListenButtonState(btn,true);
                  try{if(synth&&synth.paused)synth.resume();}catch(e){}
                };

                utterance.onend=function(){
                  var idx=window._lumenboardUtterances.indexOf(utterance);
                  if(idx>=0)window._lumenboardUtterances.splice(idx,1);
                  if(token!==currentToken)return;
                  setTimeout(function(){
                    if(token===currentToken)speakNext();
                  },180);
                };

                utterance.onerror=function(ev){
                  var idx=window._lumenboardUtterances.indexOf(utterance);
                  if(idx>=0)window._lumenboardUtterances.splice(idx,1);

                  if(ev&&(ev.error==='interrupted'||ev.error==='canceled')){
                    return;
                  }

                  if(ev&&(ev.error==='network'||ev.error==='synthesis-failed')&&utterance.voice){
                    utterance.voice=null;
                    try{synth.speak(utterance);return;}catch(e){}
                  }

                  if(token!==currentToken)return;

                  if(sentenceIndex<sentences.length){
                    speakNext();
                  }else{
                    stop();
                  }
                };

                try{
                  if(synth&&synth.paused)synth.resume();
                  synth.speak(utterance);
                  setTimeout(function(){
                    if(token===currentToken){
                      try{if(synth&&synth.paused)synth.resume();}catch(e){}
                    }
                  },200);
                }catch(e){
                  utterance.onerror({error:'speak_exception'});
                }
              }

              setTimeout(function(){
                if(token===currentToken){
                  try{if(synth&&synth.paused)synth.resume();}catch(e){}
                  speakNext();
                }
              },40);
            }

            return {
              play:play,
              stop:stop,
              isPlaying:function(btn){
                return currentBtn===btn&&Boolean(btn&&btn.classList.contains('reading'));
              },
              populateVoicePicker:populateVoicePicker,

            };

          var copyFormattedText=function(htmlContent,buttonEl){
            var plainText=htmlToFormattedPlainText(htmlContent);
            var success=false;
            var selection=window.getSelection?window.getSelection():null;
            var previousRange=selection&&selection.rangeCount?selection.getRangeAt(0).cloneRange():null;
            var copySource=document.createElement('div');
            copySource.contentEditable='true';
            copySource.setAttribute('aria-hidden','true');
            copySource.style.cssText='position:fixed;left:-9999px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none';
            copySource.innerHTML=htmlContent;
            var onCopy=function(e){
              e.preventDefault();
              if(e.clipboardData){
                e.clipboardData.clearData();
                e.clipboardData.setData('text/html',htmlContent);
                e.clipboardData.setData('text/plain',plainText);
                success=true;
              }else if(window.clipboardData){
                window.clipboardData.setData('Text',plainText);
                success=true;
              }
            };
            try{
              // Keep a real selection during execCommand. This is necessary
              // for copy support in static/file:// exports on mobile browsers.
              document.body.appendChild(copySource);
              if(selection){
                var range=document.createRange();
                range.selectNodeContents(copySource);
                selection.removeAllRanges();
                selection.addRange(range);
              }
              document.addEventListener('copy',onCopy,true);
              var execResult=document.execCommand('copy');
              if(execResult)success=true;
            }catch(e){
            }finally{
              document.removeEventListener('copy',onCopy,true);
              if(copySource.parentNode)copySource.parentNode.removeChild(copySource);
              if(selection){
                selection.removeAllRanges();
                if(previousRange)selection.addRange(previousRange);
              }
            }
            if(!success){
              try{
                var ta=document.createElement('textarea');
                ta.value=plainText;
                ta.style.position='fixed';
                ta.style.left='0';
                ta.style.top='0';
                ta.style.width='2em';
                ta.style.height='2em';
                ta.style.padding='0';
                ta.style.border='none';
                ta.style.outline='none';
                ta.style.boxShadow='none';
                ta.style.background='transparent';
                ta.style.opacity='0.01';
                ta.setAttribute('readonly','');
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                ta.setSelectionRange(0,ta.value.length);
                success=document.execCommand('copy')||success;
                document.body.removeChild(ta);
              }catch(e){}
            }
            var showCopyState=function(copied){
              if(!buttonEl)return;
              if(!copied){
                buttonEl.setAttribute('title','Copy was blocked by this browser');
                buttonEl.setAttribute('aria-label','Copy was blocked by this browser');
                setTimeout(function(){buttonEl.setAttribute('title','Copy text with formatting');buttonEl.setAttribute('aria-label','Copy text with formatting');},2200);
                return;
              }
              buttonEl.classList.add('copied');
              var copySvg=buttonEl.querySelector('.copy-icon');
              var checkSvg=buttonEl.querySelector('.check-icon');
              if(copySvg)copySvg.style.display='none';
              if(checkSvg)checkSvg.style.display='block';
              buttonEl.setAttribute('title','Copied text with formatting!');
              buttonEl.setAttribute('aria-label','Copied text with formatting!');
              setTimeout(function(){
                buttonEl.classList.remove('copied');
                if(copySvg)copySvg.style.display='block';
                if(checkSvg)checkSvg.style.display='none';
                buttonEl.setAttribute('title','Copy text with formatting');
                buttonEl.setAttribute('aria-label','Copy text with formatting');
              },1500);
            };
            var asyncWriteStarted=false;
            if(window.isSecureContext&&navigator.clipboard&&navigator.clipboard.write&&typeof ClipboardItem!=='undefined'){
              try{
                asyncWriteStarted=true;
                var blobHtml=new Blob([htmlContent],{type:'text/html'});
                var blobText=new Blob([plainText],{type:'text/plain'});
                navigator.clipboard.write([new ClipboardItem({'text/html':blobHtml,'text/plain':blobText})]).then(function(){
                  success=true;
                  showCopyState(true);
                }).catch(function(){if(!success)showCopyState(false);});
              }catch(e){asyncWriteStarted=false;}
            }
            if(success)showCopyState(true);
            else if(!asyncWriteStarted)showCopyState(false);
            return success;
          };
          document.addEventListener('click',function(e){

          document.querySelectorAll('.lumenboard-diagram-scroll').forEach(function(scroll){
            var isDown=false,startX=0,startY=0,scrollLeft=0,scrollTop=0,hasMoved=false;

              if(e.target.closest('a,button,input,textarea,select'))return;
              if(e.button!==0&&e.button!==1)return;
              isDown=true;
              hasMoved=false;
              scroll.classList.add('panning');
              startX=e.clientX;
              startY=e.clientY;
              scrollLeft=scroll.scrollLeft;
              scrollTop=scroll.scrollTop;
            });
            window.addEventListener('mousemove',function(e){
              if(!isDown)return;
              var dx=e.clientX-startX;
              var dy=e.clientY-startY;
              if(Math.abs(dx)>3||Math.abs(dy)>3)hasMoved=true;
              scroll.scrollLeft=scrollLeft-dx;
              scroll.scrollTop=scrollTop-dy;
            });
            window.addEventListener('mouseup',function(){
              if(isDown){isDown=false;scroll.classList.remove('panning');}
            });
            scroll.addEventListener('dragstart',function(e){e.preventDefault()});
            scroll.addEventListener('click',function(e){
              if(hasMoved){e.preventDefault();e.stopPropagation();hasMoved=false;}
            },true);
            scroll.addEventListener('wheel',function(event){
              if(!event.ctrlKey&&!event.metaKey)return;
              event.preventDefault();
              zoom(scroll,event.deltaY<0?.1:-.1);

          window.addEventListener('keydown',function(e){
            var activeScroll=document.querySelector('.lumenboard-diagram-scroll');

            if(e.key==='ArrowLeft'){activeScroll.scrollLeft-=step;}
            else if(e.key==='ArrowRight'){activeScroll.scrollLeft+=step;}
            else if(e.key==='ArrowUp'){activeScroll.scrollTop-=step;}
            else if(e.key==='ArrowDown'){activeScroll.scrollTop+=step;}

            var a=e.target.closest('a');

            if(!href)return;
            if(a.hasAttribute('data-download-bypass')||href.indexOf('blob:')===0)return;
            var clean=href.split('?')[0].split('#')[0];
            if(/.json$/i.test(clean)||a.hasAttribute('data-download-json')){
              e.preventDefault();
              e.stopPropagation();
              var fn=a.getAttribute('download')||decodeURIComponent(clean.split('/').pop()||'data.json');
              fetch(href).then(function(r){
                if(!r.ok)throw new Error('status '+r.status);
                return r.blob();
              }).then(function(b){
                var u=URL.createObjectURL(b);
                var dl=document.createElement('a');
                dl.setAttribute('data-download-bypass','true');
                dl.href=u;
                dl.download=fn;
                document.body.appendChild(dl);
                dl.click();
                document.body.removeChild(dl);
                setTimeout(function(){URL.revokeObjectURL(u);},1500);
              }).catch(function(){
                var dl=document.createElement('a');
                dl.setAttribute('data-download-bypass','true');
                dl.href=href;
                dl.download=fn;
                dl.target='_blank';
                document.body.appendChild(dl);
                dl.click();
                document.body.removeChild(dl);
              });
            }
          },true);
